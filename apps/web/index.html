<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07111f" />
  <title>آزمایشگاه فیزیک آریا — Stage 4</title>
  <link rel="stylesheet" href="/apps/web/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">A</span><div><strong>آزمایشگاه فیزیک آریا</strong><small>Scene Editor · Stage 4</small></div></div>
      <div class="toolbar" aria-label="کنترل‌های آزمایش">
        <button id="new-scene" class="tool-btn" title="صحنه جدید">＋</button>
        <button id="undo" class="tool-btn" title="واگرد">↶</button>
        <button id="redo" class="tool-btn" title="بازانجام">↷</button>
        <span class="separator"></span>
        <button id="run-toggle" class="run-btn"><span id="run-icon">▶</span><span id="run-label">اجرا</span></button>
        <button id="step" class="tool-btn" title="یک گام">▹|</button>
        <button id="reset" class="tool-btn" title="بازنشانی">↺</button>
        <span class="runtime-time" id="runtime-time">t = ۰٫۰۰۰ s</span>
      </div>
      <div class="file-actions">
        <button id="import-scene" class="ghost-btn">ورود JSON</button>
        <button id="export-scene" class="ghost-btn">خروجی JSON</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <main class="editor-grid">
      <aside class="palette-panel panel">
        <div class="panel-heading"><div><strong>کتابخانه قطعات</strong><small id="catalog-count">در حال بارگذاری…</small></div></div>
        <div class="search-wrap"><input id="part-search" type="search" placeholder="جست‌وجوی قطعه…" autocomplete="off" /></div>
        <nav id="domain-tabs" class="domain-tabs"></nav>
        <div id="part-list" class="part-list" aria-live="polite"></div>
      </aside>

      <section class="workspace-wrap">
        <div class="workspace-toolbar">
          <div class="scene-title"><input id="scene-title" value="صحنه جدید" aria-label="نام صحنه" /><span id="scene-domain-badge">ترکیبی</span></div>
          <div class="workspace-tools">
            <button id="select-mode" class="mode-btn active">انتخاب</button>
            <button id="wire-mode" class="mode-btn">سیم/اتصال</button>
            <button id="delete-selected" class="mode-btn danger">حذف</button>
          </div>
        </div>
        <div id="workspace" class="workspace" tabindex="0">
          <svg id="connection-layer" class="connection-layer" aria-hidden="true"></svg>
          <div class="workspace-grid"></div>
          <div id="part-layer" class="part-layer"></div>
          <div id="empty-state" class="empty-state"><div class="empty-icon">⚛</div><strong>قطعه‌ای به صحنه اضافه کنید</strong><span>از کتابخانه بکشید و روی صفحه رها کنید.</span></div>
          <div class="workspace-hud"><span id="part-count">۰ قطعه</span><span id="connection-count">۰ اتصال</span><span id="zoom-label">۱۰۰٪</span></div>
        </div>
        <section class="bottom-panel panel">
          <div class="bottom-tabs"><button class="bottom-tab active" data-tab="measure">اندازه‌گیری</button><button class="bottom-tab" data-tab="graph">نمودار</button><button class="bottom-tab" data-tab="scene-json">Scene JSON</button></div>
          <div id="bottom-content" class="bottom-content"></div>
        </section>
      </section>

      <aside class="inspector-panel panel">
        <div class="panel-heading"><div><strong>ویژگی‌ها</strong><small id="selection-subtitle">هیچ قطعه‌ای انتخاب نشده</small></div></div>
        <div id="inspector" class="inspector-empty"><div>یک قطعه را انتخاب کنید تا تنظیمات آن نمایش داده شود.</div></div>
      </aside>
    </main>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script type="module" src="/apps/web/src/main.js"></script>
</body>
</html>
