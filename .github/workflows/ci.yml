name: Aria Lab Physics CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'stage*']

permissions:
  contents: read

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run validation, physics regression, and web smoke tests
        run: npm run ci
